databaseChangeLog:
  - changeSet:
      id: 003-create-task-table
      author: ABDI

      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: varchar(500)

              - column:
                  name: status
                  type: varchar(11)

              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: started_at
                  type: timestamp with time zone

              - column:
                  name: ended_at
                  type: timestamp with time zone