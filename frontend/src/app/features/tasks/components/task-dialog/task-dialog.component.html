<h2 mat-dialog-title>
  {{ isEdit ? 'Edit task' : 'Create task' }}
</h2>
<mat-dialog-content>
  <form [formGroup]="form">

    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title">
    </mat-form-field>
  <br>
    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        formControlName="description"
        rows="4">
      </textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">
    Cancel
  </button>

  <button
    mat-raised-button
    color="primary"
    type="button"
    [disabled]="form.invalid"
    (click)="save()">
    {{ isEdit ? 'Save changes' : 'Create task' }}
  </button>

</mat-dialog-actions>
